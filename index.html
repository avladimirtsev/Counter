<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик прироста богатства</title>
    <style>
        body {
            background: linear-gradient(-45deg, #0f172a, #1e3a5f, #00ff88, #0f172a);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 1.5rem;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 3rem 1rem 2rem;
            overflow-x: hidden;
            overflow-y: auto;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .counter-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 1.5rem 3rem;
            border-radius: 16px;
            backdrop-filter: blur(4px);
            min-width: 260px;
        }

        .counter-label {
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }

        .counter {
            font-size: 2.2rem;
            text-shadow: 0 0 20px #00ff88;
            font-variant-numeric: tabular-nums;
        }

        .counter.blue { color: #38bdf8; text-shadow: 0 0 20px #38bdf8; }
        .counter.white { color: #FFFDD0; text-shadow: 0 0 20px #FFFDD0; }

        .withdraw-btn {
            min-width: 260px;
            padding: 1.2rem 3rem;
            background: linear-gradient(135deg, #ff3d71, #e11d74);
            color: #000;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 61, 113, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease, background 0.3s ease;
        }
        .withdraw-btn:hover { filter: brightness(1.1); }
        .withdraw-btn:active { transform: scale(0.97); }
        .withdraw-btn:disabled {
            background: linear-gradient(135deg, #64748b, #475569);
            color: #1e293b;
            cursor: not-allowed;
            box-shadow: none; filter: none; transform: none;
        }

        .news-box {
            min-width: 260px;
            max-width: 300px;
            max-height: 300px;
            overflow-y: auto;
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            padding: 1.5rem 2rem;
            border-radius: 16px;
            backdrop-filter: blur(4px);
            text-align: left;
        }

        .news-title {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }

        .news-list {
            list-style: none;
            padding: 0; margin: 0;
            display: flex; flex-direction: column; gap: 0.9rem;
        }

        .news-item { color: #cbd5e1; font-size: 0.9rem; line-height: 1.45; }
        .news-item .news-date {
            display: block; color: #64748b; font-size: 0.75rem;
            letter-spacing: 1px; margin-bottom: 0.2rem;
        }
        .news-item .news-text { color: #e2e8f0; }
        .news-item.new .news-text { color: #00ff88; }
    </style>
</head>
<body>
    <div class="counter-box">
        <div class="counter-label">Богатство</div>
        <div class="counter" id="counter1">0</div>
    </div>

    <div class="counter-box">
        <div class="counter-label">Численность</div>
        <div class="counter blue" id="counter2">0</div>
    </div>

    <div class="counter-box">
        <div class="counter-label">Ваш счет</div>
        <div class="counter white" id="counter3">0</div>
    </div>

    <button class="withdraw-btn" id="withdrawBtn">Получить долю богатства</button>

    <div class="news-box">
        <div class="news-title">Новости проекта</div>
        <ul class="news-list" id="newsList"></ul>
    </div>

    <script>
        // === НАСТРОЙКИ СЧЁТЧИКОВ ===
        const counters = [
            {
                el: document.getElementById("counter1"),
                baseValue: 2680,
                startDate: new Date("2026-10-15T00:00:00+03:00").getTime(),
                perSecond: 0.0012407407,
                digits: 4
            },
            {
                el: document.getElementById("counter2"),
                baseValue: 143000000,
                startDate: new Date("2026-10-14T00:00:00+03:00").getTime(),
                perSecond: -0.011,
                digits: 0
            },
            {
                el: document.getElementById("counter3"),
                baseValue: 0,
                startDate: null,        // стартует только после клика
                perSecond: 0.00000000000867651,
                digits: 10,
                active: false,          // пока не активен — показываем baseValue
                id: "counter3"          // ключ для localStorage
            }
        ];

        const counter3 = counters[2];

        // ============================================================
        // СОХРАНЕНИЕ / ВОССТАНОВЛЕНИЕ
        // ============================================================
        function saveCounterState(c) {
            try {
                localStorage.setItem(c.id + "_state", JSON.stringify({
                    baseValue: c.baseValue,
                    startDate: c.startDate,
                    perSecond: c.perSecond,
                    active: c.active
                }));
            } catch (e) {
                console.warn("Не удалось сохранить состояние " + c.id, e);
            }
        }

        function loadCounterState(c) {
            const raw = localStorage.getItem(c.id + "_state");
            if (!raw) return;
            try {
                const s = JSON.parse(raw);
                if (typeof s.baseValue === "number") c.baseValue = s.baseValue;
                if (typeof s.perSecond === "number") c.perSecond = s.perSecond;
                if (typeof s.active === "boolean") c.active = s.active;
                if (s.startDate === null || typeof s.startDate === "number") {
                    c.startDate = s.startDate;
                }
            } catch (e) {
                console.warn("Не удалось восстановить состояние " + c.id, e);
            }
        }

        // ============================================================
        // ФУНКЦИЯ СМЕНЫ СКОРОСТИ (со снимком текущего значения)
        // ============================================================
        function changeSpeed(c, newSpeed) {
            if (!c.active || c.startDate === null) {
                c.perSecond = newSpeed;
                if (c.id) saveCounterState(c);
                return;
            }

            const now = Date.now();
            const secondsPassed = (now - c.startDate) / 1000;
            c.baseValue = c.baseValue + c.perSecond * secondsPassed;
            c.startDate = now;
            c.perSecond = newSpeed;

            if (c.id) saveCounterState(c);
        }

        // ============================================================
        // ВОССТАНОВЛЕНИЕ СОСТОЯНИЯ — ДО первого update()
        // ============================================================
        loadCounterState(counter3);

        // Страховка №1: если кнопка уже нажата в прошлом,
        // но startDate потерян (битый/отсутствующий state) —
        // считаем, что отсчёт идёт с этого момента, и сохраняем.
        if (localStorage.getItem("withdrawn") === "1") {
            if (!counter3.active) {
                counter3.active = true;
            }
            if (counter3.startDate === null) {
                counter3.startDate = Date.now();
            }
            saveCounterState(counter3);
        }

        // ============================================================
        // ОБНОВЛЕНИЕ СЧЁТЧИКОВ
        // ============================================================
        function update() {
            const now = Date.now();

            for (const c of counters) {
                // Страховка №2: активен, но точка отсчёта потерялась
                // (например, state частично повреждён) — восстанавливаем.
                if (c.active === true && c.startDate === null) {
                    c.startDate = now;
                    if (c.id) saveCounterState(c);
                }

                if (c.active === false || c.startDate === null) {
                    c.el.textContent = c.baseValue.toLocaleString("ru-RU", {
                        minimumFractionDigits: c.digits,
                        maximumFractionDigits: c.digits
                    });
                    continue;
                }

                const secondsPassed = (now - c.startDate) / 1000;
                const current = c.baseValue + c.perSecond * secondsPassed;

                c.el.textContent = current.toLocaleString("ru-RU", {
                    minimumFractionDigits: c.digits,
                    maximumFractionDigits: c.digits
                });
            }

            requestAnimationFrame(update);
        }
        update();

        // ============================================================
        // КНОПКА
        // ============================================================
        const btn = document.getElementById("withdrawBtn");

        if (localStorage.getItem("withdrawn") === "1") {
            btn.textContent = "Вам уже поступает доля Богатства.";
            btn.disabled = true;
        }

        btn.addEventListener("click", () => {
            if (btn.disabled) return;

            btn.textContent = "Поздравляем! Теперь Вы получаете долю Богатства.";
            btn.disabled = true;

            counter3.startDate = Date.now();
            counter3.active = true;

            localStorage.setItem("withdrawn", "1");
            saveCounterState(counter3);

            // fetch("/api/withdraw", { method: "POST" });
        });

        // ============================================================
        // ДЕМО: смена скорости counter3 через 30 сек после старта
        // ============================================================
        // setTimeout(() => {
             changeSpeed(counter3, 0.00000000000902616);
        //     console.log("Скорость counter3 изменена");
        // }, 30000);

        // ============================================================
        // НОВОСТИ
        // ============================================================
        const news = [
            { date: "15.10.2026", text: "💡Скорость прироста Богатства на Вашем счете увеличилась на 4%⚡️. Накопленная доля от Богатства сохранилась.", isNew: true },
            { date: "14.10.2026", text: "Подключение личного счета."},
            { date: "13.10.2026", text: "Подключение новой страны - Россия🇷🇺." },
            { date: "13.10.2026", text: "⚡️Запуск проекта. Владимир Владимирович передал Проекту свои 1000₽💰 и пожелал роста🌱" }
        ];

        function renderNews() {
            const list = document.getElementById("newsList");
            list.innerHTML = "";

            if (!news.length) {
                const empty = document.createElement("li");
                empty.className = "news-item";
                empty.innerHTML = `<span class="news-text" style="color:#64748b">Пока новостей нет</span>`;
                list.appendChild(empty);
                return;
            }

            for (const item of news) {
                const li = document.createElement("li");
                li.className = "news-item" + (item.isNew ? " new" : "");
                li.innerHTML = `
                    <span class="news-date">${item.date}</span>
                    <span class="news-text">${item.text}</span>
                `;
                list.appendChild(li);
            }
        }

        renderNews();
    </script>
</body>
</html>
