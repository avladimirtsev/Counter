<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик прироста богатства</title>
    <style>
        body {
            background-color: #0f172a;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
            margin: 0;
            font-size: 6rem;
        }
        #counter {
            text-shadow: 0 0 20px #00ff88;
        }
    </style>
</head>
<body>
    <div id="counter">0</div>

    <script>
        // === НАСТРОЙКИ ВАШЕГО СЧЁТЧИКА ===
        // Базовая цифра на момент начала отсчёта
        const baseValue =2576; 
        
        // Точка отсчёта (когда baseValue был актуален)
        const startDate = new Date("2026-10-12T00:00:00+03:00").getTime(); 
        
        // Скорость роста в секунду (например, +5 в секунду)
        const perSecond = 0.1; 

        const el = document.getElementById("counter");

        function update() {
            const now = Date.now();
            const secondsPassed = (now - startDate) / 1000;
            const current = baseValue + (perSecond * secondsPassed);
             
            // Показываем только целую часть + 5 знака (меньше мельтешения)
    el.textContent = current.toLocaleString("ru-RU", {
        minimumFractionDigits: 5,
        maximumFractionDigits: 5
    });
        
            // Плавное обновление (браузер сам решает, когда рисовать)
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
