<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счётчик прироста богатства</title>
    <style>
        /* === ФОН: АНИМИРОВАННЫЙ ГРАДИЕНТ === */
        body {
            background: linear-gradient(-45deg, #0f172a, #1e3a5f, #00ff88, #0f172a);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            
            /* === ОФОРМЛЕНИЕ СЧЁТЧИКА === */
            color: #00ff88;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;      /* ← счётчики друг под другом */
            justify-content: flex-start;
            align-items: center;
            gap: 1.5rem;                 /* отступ между карточками */
            min-height: 100vh;
            min-height: 100dvh;          /* на мобильных */
            margin: 0;
            padding: 3rem 1rem 2rem;
            overflow-x: hidden; /* чтобы градиент не создавал прокрутку */
            overflow-y: auto;
        }

        /* Ключевые кадры для движения градиента */
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Карточка счётчика */
        .counter-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 1.5rem 3rem;
            border-radius: 16px;
            backdrop-filter: blur(4px);
            min-width: 260px;
        }

        /* Надпись над счётчиком */
        .counter-label {
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            text-shadow: none;
        }

        /* Сам счётчик */
        .counter {
            font-size: 2.2rem;
            text-shadow: 0 0 20px #00ff88;
            font-variant-numeric: tabular-nums;
        }

        /* Второй счётчик — другим цветом, чтобы отличался */
        .counter.blue {
            color: #38bdf8;
            text-shadow: 0 0 20px #38bdf8;
        }
        /* Третий счётчик — другим цветом, чтобы отличался */
        .counter.white {
            color: #FFFDD0;
            text-shadow: 0 0 20px #FFFDD0;
        }   
        /* === КНОПКА "ВЫВОД ДОХОДА" === */
        .withdraw-btn {
            min-width: 260px;
            padding: 1.2rem 3rem;
            background: linear-gradient(135deg, #ff3d71, #e11d74);
            color: #000;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 61, 113, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .withdraw-btn:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 35px rgba(255, 61, 113, 0.8);
        }

        .withdraw-btn:active {
            transform: scale(0.97);
            box-shadow: 0 0 15px rgba(255, 61, 113, 0.6);
        }
        /* === БЛОК НОВОСТЕЙ === */
        .news-box {
            min-width: 260px;
            max-width: 300px;
            max-height: 300px;
            overflow-y: auto;
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            padding: 1.5rem 2rem;
            border-radius: 16px;
            backdrop-filter: blur(4px);
            text-align: left;
        }

        .news-title {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }

        .news-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        .news-item {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .news-item .news-date {
            display: block;
            color: #64748b;
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }

        .news-item .news-text {
            color: #e2e8f0;
        }

        .news-item.new .news-text {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="counter-box">
        <div class="counter-label">Богатство</div>
        <div class="counter" id="counter1">0</div>
    </div>

    <div class="counter-box">
        <div class="counter-label">Численность</div>
        <div class="counter blue" id="counter2">0</div>
    </div>

    <div class="counter-box">
        <div class="counter-label">Ваш счет</div>
        <div class="counter white" id="counter3">0</div>
    </div>
    
    <button class="withdraw-btn" id="withdrawBtn">Вывод дохода</button>

    <!-- === БЛОК НОВОСТЕЙ === -->
    <div class="news-box">
        <div class="news-title">Новости проекта</div>
        <ul class="news-list" id="newsList"></ul>
    </div>
    
    <script>
        // === НАСТРОЙКИ СЧЁТЧИКОВ ===
        const counters = [
            {
                el: document.getElementById("counter1"),
                baseValue: 2576,
                startDate: new Date("2026-10-14T00:00:00+03:00").getTime(),
                perSecond: 0.0011925926,
                digits: 4
            },
            {
                el: document.getElementById("counter2"),
                baseValue: 143000000,                 // своё стартовое значение
                startDate: new Date("2026-10-14T00:00:00+03:00").getTime(),
                perSecond: -0.011,                // своя скорость
                digits: 0
            },
            {
                el: document.getElementById("counter3"),
                baseValue: 0,                 // своё стартовое значение
                startDate: new Date("2026-10-14T00:00:00+03:00").getTime(),
                perSecond: 0.00000000000867651,                // своя скорость
                digits: 10
        }
        ];

        function update() {
            const now = Date.now();

            for (const c of counters) {
                const secondsPassed = (now - c.startDate) / 1000;
                const current = c.baseValue + c.perSecond * secondsPassed;

                c.el.textContent = current.toLocaleString("ru-RU", {
                    minimumFractionDigits: c.digits,
                    maximumFractionDigits: c.digits
                });
            }

            requestAnimationFrame(update);
        }
        update();
        // === ОБРАБОТЧИК КНОПКИ ===
        document.getElementById("withdrawBtn").addEventListener("click", () => {
            alert("Заявка на вывод дохода отправлена!");
        });
        // === НОВОСТИ ПРОЕКТА ===
        // Просто добавляйте объекты в массив — они появятся на странице.
        const news = [
            {
                date: "14.10.2026",
                text: "Подключение личного счета.",
                isNew: true
            },
            {
                date: "13.10.2026",
                text: "Подключение и тестирование страны - Россия."
            },
            {
                date: "13.10.2026",
                text: "Запуск проекта."
            }
        ];

        function renderNews() {
            const list = document.getElementById("newsList");
            list.innerHTML = "";

            if (!news.length) {
                const empty = document.createElement("li");
                empty.className = "news-item";
                empty.innerHTML = `<span class="news-text" style="color:#64748b">Пока новостей нет</span>`;
                list.appendChild(empty);
                return;
            }

            for (const item of news) {
                const li = document.createElement("li");
                li.className = "news-item" + (item.isNew ? " new" : "");
                li.innerHTML = `
                    <span class="news-date">${item.date}</span>
                    <span class="news-text">${item.text}</span>
                `;
                list.appendChild(li);
            }
        }

        renderNews();
    </script>
</body>
</html>
